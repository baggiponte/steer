[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steer"
version = "0.1.0"
description = "A small CLI for exploring activation steering in local language models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "click>=8.1",
  "rich>=13.9",
  "safetensors>=0.5",
  "torch>=2.6",
  "transformers>=4.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
steer = "steer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/steer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
